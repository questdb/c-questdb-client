trigger: none

variables:
  OS_MAPPING: none
  Windows_NT-X86: windows
  Darwin-X64: osx
  Darwin-ARM: armosx
  Linux-ARM: armlinux
  Linux-X64: linux

stages:
  - stage: BuildAndTest
    displayName: "Building and testing"
    jobs:
      # The four Linux toolchain legs run on the self-hosted x86 pool.
      # incus_prepare installs the missing build dependencies, exports the
      # image JDK paths, and provisions a user-writable Rust toolchain for
      # the beta/nightly matrix legs.
      - job: RunOn
        displayName: "on"
        strategy:
          matrix:
            linux:
              imageName: "hetzner-incus"
            linux-stable:
              imageName: "hetzner-incus"
              toolchain: "stable"
            linux-beta:
              imageName: "hetzner-incus"
              toolchain: "beta"
            linux-nightly:
              imageName: "hetzner-incus"
              toolchain: "nightly"
        pool:
          name: hetzner-incus
        timeoutInMinutes: 90
        variables:
          # The higher-core-count pool exposes released-port races in the
          # existing Rust tests. Match the hosted runner's concurrency until
          # those tests are fixed separately.
          RUST_TEST_THREADS: 4
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/incus_prepare.yaml
            parameters:
              aptPackages:
                - cmake
              pipNumpy: true
              # The beta and nightly legs install their own toolchain in
              # compile.yaml; bootstrapping stable first would download a
              # toolchain they never compile with.
              rustToolchain: none
          # The one leg that pins no toolchain: compile.yaml's
          # `rustup default $(toolchain)` step is conditional on a non-empty
          # value, so this leg would otherwise reach cargo with none installed.
          - script: rustup default stable
            condition: eq(variables['toolchain'], '')
            displayName: "Install stable for the unpinned leg"
          - template: templates/compile.yaml
            parameters:
              cxx20Variants: true
          - script: |
              cd questdb-rs
              cargo build --examples --features almost-all-features,arrow,polars
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
            displayName: "Build Rust examples"
          - script: python3 ci/run_all_tests.py unit
            env:
              JAVA_HOME: $(JAVA_HOME_25_X64)
            displayName: "Unit tests"
          # Build QuestDB master for run_all_tests.py's `--repo ./questdb`.
          # Keep source-checkout coverage after QWP ships; add a separate
          # `--versions` gate for the exact QuestDB 10.0 release artifact.
          - template: templates/clone_questdb.yaml
          - task: Maven@3
            displayName: "Compile QuestDB"
            retryCountOnTaskFailure: 2
            inputs:
              mavenPOMFile: "questdb/pom.xml"
              javaHomeOption: "Path"
              jdkDirectory: "$(JAVA_HOME_25_X64)"
              options: "-DskipTests -Pbuild-web-console$(CLIENT_PROFILE)"
          - script: python3 ci/run_all_tests.py integration
            env:
              JAVA_HOME: $(JAVA_HOME_25_X64)
            displayName: "Integration tests"
          # - task: PublishBuildArtifacts@1
          #   inputs:
          #     pathToPublish: ./build
          #   displayName: "Publish build directory"
      # mac/windows: run cargo vs native (build + C++ + integration) as two
      # parallel jobs to cut the slow legs' wall-clock. linux stays in RunOn.
      #
      # Every mac leg in this file pins macOS-15-arm64. The plain
      # macOS-14/15/26 Azure images are Intel x86-64, and QuestDB bundles a
      # macOS native library for aarch64 only, so a job that starts the server
      # cannot run on an Intel agent. Keeping the cargo-only legs on the same
      # image tests the one macOS architecture the client ships against.
      - job: RustTests
        displayName: "cargo tests (mac/windows)"
        strategy:
          matrix:
            mac:
              imageName: "macOS-15-arm64"
            windows-msvc-2022:
              imageName: "windows-2022"
            windows-msvc-2025:
              imageName: "windows-2025"
        pool:
          vmImage: $(imageName)
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - script: python3 ci/run_all_tests.py cargo
            displayName: "cargo tests"
      - job: NativeTests
        displayName: "build + C++ + integration (mac/windows)"
        strategy:
          matrix:
            mac:
              imageName: "macOS-15-arm64"
            windows-msvc-2022:
              imageName: "windows-2022"
            windows-msvc-2025:
              imageName: "windows-2025"
        pool:
          vmImage: $(imageName)
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/compile.yaml
            parameters:
              cxx20Variants: true
          - script: python3 ci/run_all_tests.py cpp
            displayName: "C++ tests"
          # Build QuestDB master for run_all_tests.py's `--repo ./questdb`.
          - template: templates/resolve_jdk25.yaml
          - template: templates/clone_questdb.yaml
          - task: Maven@3
            displayName: "Compile QuestDB"
            retryCountOnTaskFailure: 2
            inputs:
              mavenPOMFile: "questdb/pom.xml"
              javaHomeOption: "Path"
              jdkDirectory: "$(JAVA_HOME)"
              options: "-DskipTests -Pbuild-web-console$(CLIENT_PROFILE)"
          - script: python3 ci/run_all_tests.py integration
            env:
              JAVA_HOME: $(JAVA_HOME)
            displayName: "Integration tests"
          - task: ArchiveFiles@2
            displayName: "Compress QuestDB server log on failure"
            condition: failed()
            continueOnError: true
            inputs:
              rootFolderOrFile: >-
                $(Build.SourcesDirectory)/build/questdb/repo/data/log
              includeRootFolder: false
              archiveType: zip
              archiveFile: >-
                $(Build.ArtifactStagingDirectory)/qdb-log-native-$(imageName).zip
              quiet: true
          - task: PublishBuildArtifacts@1
            displayName: "Publish QuestDB server log on failure"
            condition: failed()
            continueOnError: true
            inputs:
              pathToPublish: >-
                $(Build.ArtifactStagingDirectory)/qdb-log-native-$(imageName).zip
              artifactName: qdb-log-native-$(imageName)
      - job: VersionMatrix
        displayName: "arrow/polars version-range tests (linux)"
        pool:
          name: hetzner-incus
        timeoutInMinutes: 90
        variables:
          # run_version_matrix.py executes the same Rust tests as RunOn.
          RUST_TEST_THREADS: 4
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/incus_prepare.yaml
            parameters:
              isAptInstallEnabled: false
          - script: python3 ci/run_version_matrix.py
            displayName: "questdb-rs: pinned arrow/polars versions"
      - job: RustMsrvAndDocs
        displayName: "Rust MSRV and release documentation"
        pool:
          name: hetzner-incus
        timeoutInMinutes: 45
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/incus_prepare.yaml
            parameters:
              isAptInstallEnabled: false
              # Every cargo invocation below is `+1.91.1`; a bootstrap
              # stable would be downloaded and never used.
              rustToolchain: none
          - script: rustup toolchain install 1.91.1 --profile minimal
            displayName: "Install Rust 1.91.1"
          - script: |
              cargo +1.91.1 check --manifest-path questdb-rs/Cargo.toml
              cargo +1.91.1 check --manifest-path questdb-rs/Cargo.toml \
                --features almost-all-features,arrow,polars
              cargo +1.91.1 check \
                --manifest-path questdb-rs-ffi/Cargo.toml --all-features
            displayName: "Check advertised features at the MSRV"
          - script: |
              cargo +1.91.1 doc --manifest-path questdb-rs/Cargo.toml \
                --no-deps --features almost-all-features,arrow,polars
            env:
              RUSTDOCFLAGS: "-D warnings"
            displayName: "Build docs.rs feature set with warnings denied"
          - script: python3 ci/check_docs.py
            displayName: "Check release documentation"
      - job: FormatAndLinting
        displayName: "cargo fmt and clippy"
        pool:
          name: hetzner-incus
        timeoutInMinutes: 10
        steps:
          - checkout: self
          - template: templates/incus_prepare.yaml
            parameters:
              aptPackages:
                - pipx
              # The pinned toolchain below is this job's compiler; skip the
              # bootstrap stable it would otherwise replace.
              rustToolchain: none
          - script: |
              # `set -e` without `-x`: the trace of an `echo "##vso[...]"`
              # line is itself parsed by Azure, quotes and all. See the
              # JAVA_HOME comment in templates/incus_prepare.yaml.
              set -e
              # Pinned for the same reason clang-format is, and now for a
              # sharper one: this job runs `clippy -- -D warnings`, and the
              # ephemeral containers install whatever stable is current at
              # the moment the job starts. Every Rust release therefore
              # lands its new lints on the next PR to build, as errors, in
              # code that was clean the day before. 1.98.0 did exactly that
              # on 2026-08-20 — `clippy::chunks_exact_to_as_chunks` turned
              # 19 untouched call sites in `ws/crypto.rs` and
              # `column_sender/arrow_batch.rs` into build failures.
              #
              # Bump this deliberately, in a change that also fixes whatever
              # the newer clippy has to say. Do not let a release day pick
              # the moment for you.
              rustup toolchain install 1.97.1 --profile minimal \
                --component clippy --component rustfmt
              rustup default 1.97.1
              rustc --version | grep -F 1.97.1
              # Pinned so local runs (`pipx install clang-format==21.1.8`)
              # and CI agree byte-for-byte; comment reflow differs between
              # clang-format major versions.
              pipx install clang-format==21.1.8
              export PATH="$HOME/.local/bin:$PATH"
              echo "##vso[task.prependpath]$HOME/.local/bin"
              clang-format --version | grep -F 21.1.8
            displayName: "Install pinned Rust, clang-format, clippy, rustfmt"
          - script: |
              cd questdb-rs
              cargo fmt --all -- --check
            displayName: "questdb-rs: fmt"
          - script: |
              cd questdb-rs
              # `live-server-tests` is included here so the live-server
              # suite (egress_live_server*, egress_live_auth) is compiled
              # and clippy-linted on every PR even though *running* it
              # needs a real server. Without this the suite builds only in
              # the live-server job and silently rots — removed APIs, new
              # clippy lints — undetected.
              cargo clippy --all-targets --features almost-all-features,live-server-tests -- -D warnings
            displayName: "questdb-rs: clippy"
          - script: |
              cd questdb-rs-ffi
              cargo fmt --all -- --check
            displayName: "questdb-rs-ffi: fmt"
          - script: |
              cd questdb-rs-ffi
              cargo clippy --all-targets --all-features -- -D warnings
            displayName: "questdb-rs-ffi: clippy"
          - script: |
              python3 ci/format_cpp.py --check
            displayName: "C/C++ clang-format"
          - script: |
              cd system_test
              cd tls_proxy
              cargo fmt --all -- --check
            displayName: "tls_proxy: fmt"
          - script: |
              cd system_test
              cd tls_proxy
              cargo clippy --all-targets --all-features -- -D warnings
            displayName: "tls_proxy: clippy"
          - script: |
              cd system_test
              cd failover_clients
              cargo fmt --all -- --check
            displayName: "failover_clients: fmt"
          - script: |
              cd system_test
              cd failover_clients
              cargo clippy --all-targets --all-features
            displayName: "failover_clients: clippy"
      - job: SanitizeCppTests
        displayName: "C/C++ tests under ASan + UBSan"
        pool:
          name: hetzner-incus
        timeoutInMinutes: 60
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/incus_prepare.yaml
            parameters:
              aptPackages:
                - cmake
          - script: |
              cmake -S . -B build_sanitize \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DQUESTDB_TESTS_AND_EXAMPLES=ON \
                -DQUESTDB_SANITIZE=ON
            displayName: "Configure (ASan + UBSan)"
          - script: cmake --build build_sanitize --config Release
            displayName: "Build"
          - script: ctest --output-on-failure -E rust_tests
            workingDirectory: build_sanitize
            displayName: "ctest under ASan + UBSan"
      # Runs the full system_test suite against a fresh build of QuestDB
      # master. The job stays on the self-hosted x86 pool for disk headroom;
      # incus_prepare installs cmake and numpy>=2, exports the image JDKs, and
      # provisions a user-writable Rust toolchain in the ephemeral container.
      - job: TestVsQuestDBMaster
        displayName: "Vs QuestDB master"
        pool:
          name: hetzner-incus
        timeoutInMinutes: 90
        variables:
          imageName: hetzner-incus
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/incus_prepare.yaml
            parameters:
              aptPackages:
                - cmake
              pipNumpy: true
          - template: templates/compile.yaml
          - template: templates/clone_questdb.yaml
          - template: templates/maven_settings.yaml
          - task: Maven@3
            displayName: "Compile QuestDB"
            retryCountOnTaskFailure: 2
            inputs:
              mavenPOMFile: "questdb/pom.xml"
              javaHomeOption: "Path"
              jdkDirectory: "$(JAVA_HOME)"
              options: "-s $(MAVEN_SETTINGS_FILE) -DskipTests -Pbuild-web-console$(CLIENT_PROFILE) $(MAVEN_RUN_OPTS)"
          - script: |
              python3 system_test/test.py run --repo ./questdb -v
            displayName: "integration test"
          - script: |
              python3 system_test/test_egress_failover.py run --repo ./questdb -v
            displayName: "egress integration test"
          - task: ArchiveFiles@2
            displayName: "Compress QuestDB server log on failure"
            condition: failed()
            continueOnError: true
            inputs:
              rootFolderOrFile: $(Build.SourcesDirectory)/build/questdb/repo/data/log
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/qdb-log-vs-master-$(Agent.OS).zip
              quiet: true
          - task: PublishBuildArtifacts@1
            displayName: "Publish QuestDB server log on failure"
            condition: failed()
            continueOnError: true
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)/qdb-log-vs-master-$(Agent.OS).zip
              artifactName: qdb-log-vs-master-$(Agent.OS)
      - job: TestQwpWsFuzz
        displayName: "QWP/WS fuzz suite (mac/windows hosted)"
        strategy:
          matrix:
            mac:
              imageName: "macOS-15-arm64"
            windows-2022:
              imageName: "windows-2022"
        pool:
          vmImage: $(imageName)
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/compile.yaml
          - template: templates/resolve_jdk25.yaml
          - template: templates/clone_questdb.yaml
          - template: templates/maven_settings.yaml
          - task: Maven@3
            displayName: "Compile QuestDB"
            retryCountOnTaskFailure: 2
            inputs:
              mavenPOMFile: "questdb/pom.xml"
              javaHomeOption: "Path"
              jdkDirectory: "$(JAVA_HOME)"
              options: "-s $(MAVEN_SETTINGS_FILE) -DskipTests -Pbuild-web-console$(CLIENT_PROFILE) $(MAVEN_RUN_OPTS)"
          - script: |
              python3 system_test/test.py run --repo ./questdb TestQwpWsFuzz -v
            displayName: "TestQwpWsFuzz"
          - script: |
              python3 system_test/test.py run --repo ./questdb TestArrowEgressFuzz TestArrowEgressPerKind TestArrowEgressEmpty TestArrowIngressFuzz TestArrowIngressPerKind TestArrowIngressDesignatedTs TestArrowIngressErrors TestArrowIngressMultiBatch TestArrowIngressExtraTypes TestArrowIngressUnsupportedTypes TestArrowIngressSfa TestArrowRoundTripFuzz TestArrowRoundTripPerKind TestArrowAlignment TestArrowPolarsFuzz TestArrowPolarsRoundTripPerKind TestArrowPolarsPerDtype -v
            displayName: "TestArrowWsFuzz"
          # Mirrors ci/run_fuzz_pipeline.yaml: on failure, archive and
          # publish the QuestDB server log so PR reviewers don't have to
          # repro locally. Path comes from system_test/fixture.py:_log_path.
          - task: ArchiveFiles@2
            displayName: "Compress QuestDB server log on failure"
            condition: failed()
            continueOnError: true
            inputs:
              rootFolderOrFile: $(Build.SourcesDirectory)/build/questdb/repo/data/log
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/qdb-log-$(Agent.OS).zip
              quiet: true
          - task: PublishBuildArtifacts@1
            displayName: "Publish QuestDB server log on failure"
            condition: failed()
            continueOnError: true
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)/qdb-log-$(Agent.OS).zip
              artifactName: qdb-log-$(Agent.OS)

      # Linux leg on self-hosted hetzner-incus. incus_prepare handles the
      # missing build dependencies, JDK paths, and user-writable Rust toolchain.
      - job: TestQwpWsFuzzLinux
        displayName: "QWP/WS fuzz suite (linux/hetzner-incus)"
        pool:
          name: hetzner-incus
        timeoutInMinutes: 90
        variables:
          imageName: hetzner-incus
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/incus_prepare.yaml
          - template: templates/compile.yaml
          - template: templates/clone_questdb.yaml
          - template: templates/maven_settings.yaml
          - task: Maven@3
            displayName: "Compile QuestDB"
            retryCountOnTaskFailure: 2
            inputs:
              mavenPOMFile: "questdb/pom.xml"
              javaHomeOption: "Path"
              jdkDirectory: "$(JAVA_HOME)"
              options: "-s $(MAVEN_SETTINGS_FILE) -DskipTests -Pbuild-web-console$(CLIENT_PROFILE) $(MAVEN_RUN_OPTS)"
          - script: |
              python3 system_test/test.py run --repo ./questdb TestQwpWsFuzz -v
            displayName: "TestQwpWsFuzz"
          - script: |
              python3 system_test/test.py run --repo ./questdb TestArrowEgressFuzz TestArrowEgressPerKind TestArrowEgressEmpty TestArrowIngressFuzz TestArrowIngressPerKind TestArrowIngressDesignatedTs TestArrowIngressErrors TestArrowIngressMultiBatch TestArrowIngressExtraTypes TestArrowIngressUnsupportedTypes TestArrowIngressSfa TestArrowRoundTripFuzz TestArrowRoundTripPerKind TestArrowAlignment TestArrowPolarsFuzz TestArrowPolarsRoundTripPerKind TestArrowPolarsPerDtype -v
            displayName: "TestArrowWsFuzz"
          - task: ArchiveFiles@2
            displayName: "Compress QuestDB server log on failure"
            condition: failed()
            continueOnError: true
            inputs:
              rootFolderOrFile: $(Build.SourcesDirectory)/build/questdb/repo/data/log
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/qdb-log-$(Agent.OS).zip
              quiet: true
          - task: PublishBuildArtifacts@1
            displayName: "Publish QuestDB server log on failure"
            condition: failed()
            continueOnError: true
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)/qdb-log-$(Agent.OS).zip
              artifactName: qdb-log-$(Agent.OS)-linux

      # Live-server coverage for the OSS-questdb tests that need a real
      # server: the functional egress suite (egress_live_server) plus the
      # fuzz binaries (bind / fragmentation / random-schema / ALTER
      # orchestration), each as its own step below. Default seed gives a
      # deterministic sweep for inbound changes; the hourly cron in
      # run_fuzz_pipeline.yaml varies the seed per build.
      - job: TestQwpEgressLiveServerFuzz
        displayName: "QWP egress live-server suite"
        pool:
          name: hetzner-incus
        timeoutInMinutes: 60
        variables:
          imageName: hetzner-incus
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: false
          - template: templates/incus_prepare.yaml
          - template: templates/compile.yaml
          - template: templates/clone_questdb.yaml
          - template: templates/maven_settings.yaml
          # The image provides JDK 25; incus_prepare points JAVA_HOME at it.
          - task: Maven@3
            displayName: "Compile QuestDB"
            retryCountOnTaskFailure: 2
            inputs:
              mavenPOMFile: "questdb/pom.xml"
              javaHomeOption: "Path"
              jdkDirectory: "$(JAVA_HOME)"
              options: "-s $(MAVEN_SETTINGS_FILE) -DskipTests -Pbuild-web-console$(CLIENT_PROFILE) $(MAVEN_RUN_OPTS)"
          - script: |
              set -euxo pipefail
              cd questdb-rs
              # `--test NAME` selectors limit this step to the fuzz
              # binaries; the functional suite runs as its own step below.
              cargo test --features live-server-tests \
                --test egress_live_server_bind_fuzz \
                --test egress_live_server_fragmentation_fuzz \
                --test egress_live_server_fuzz \
                --test egress_live_server_alter_fuzz \
                -- --nocapture
            displayName: "QWP egress live-server fuzz"
          - script: |
              set -euxo pipefail
              cd questdb-rs
              # Functional egress suite (per-type decode, cursor lifecycle,
              # error taxonomy, null handling) against the same Maven-built
              # server — behavioral coverage the fuzz binaries don't give.
              cargo test --features live-server-tests --test egress_live_server -- --nocapture
            displayName: "QWP egress live-server functional suite"

      # Cross-repo trigger: fire the questdb-enterprise
      # build-and-test-e2e-c-client pipeline with this build's SHA so
      # the c_client-marked failover tests (Rust today; C / C++ as
      # those sidecars land) run against an Enterprise primary. The
      # Enterprise pipeline posts a status check back on the PR
      # (`enterprise-e2e-c-client` context); this job fire-and-forgets
      # and does not block the PR.
      #
      # Fork PRs are intentionally skipped: System.AccessToken is not
      # exposed to fork builds, so the dispatch call would fail with
      # 401. We'd rather skip silently than spam fork PRs with
      # spurious red checks.
      #
      # Prerequisites the questdb infra team needs to have configured
      # (one-time, in the Azure DevOps UI):
      #   1. Register ci/build-and-test-e2e-c-client.yaml in the
      #      `questdb-enterprise` ADO project as a pipeline. Name must
      #      match `enterprisePipelineName` below.
      #   2. Create a PAT in the `questdb-enterprise` ADO project
      #      with `Build (Read & execute)` scope (User settings →
      #      Personal access tokens → New). Add it as a secret
      #      variable on THIS pipeline named ENT_DISPATCH_PAT
      #      (Pipelines → questdb.c-questdb-client → Edit →
      #      Variables → +, mark as secret). PAT-based auth is used
      #      rather than $(System.AccessToken) because the two
      #      pipelines live in different ADO projects, and tokens
      #      issued for this project can't see the Enterprise
      #      project's pipelines API without it.
      - job: TriggerEnterpriseCClientE2E
        displayName: "Trigger questdb-enterprise c_client e2e"
        # Use the hetzner-incus self-hosted pool: the Microsoft-hosted
        # queue is consistently deeper than incus, and this is a
        # ~10-second curl+jq job so it picks up a slot quickly here.
        # The hetzner image already ships curl + jq (the Enterprise
        # ReportToOssPr stage uses both).
        pool:
          name: hetzner-incus
        # Skip on fork PRs: secret pipeline variables (and System
        # tokens) are not exposed to fork builds, so the REST POST
        # would 401. Skipping rather than failing keeps fork-PR CI
        # clean.
        condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
        variables:
          # Hardcoded because the Enterprise pipeline lives in its own
          # ADO project, not the one this pipeline runs in.
          enterpriseProject: 'questdb-enterprise'
          enterprisePipelineName: 'build-and-test-e2e-c-client'
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail

              ORG_URL="$(System.TeamFoundationCollectionUri)"
              PROJECT="$(enterpriseProject)"
              PIPELINE_NAME="$(enterprisePipelineName)"

              if [ -z "${ENT_DISPATCH_PAT:-}" ]; then
                echo "ERROR: ENT_DISPATCH_PAT secret pipeline variable is not set." >&2
                echo "Create a PAT in the questdb-enterprise ADO project with" >&2
                echo "'Build (Read & execute)' scope and add it as a secret" >&2
                echo "variable named ENT_DISPATCH_PAT on this pipeline." >&2
                exit 1
              fi

              # Resolve pipeline ID by name. The pipelines list API
              # returns every pipeline in the project; we filter
              # client-side because the $filter query parameter on
              # this endpoint is limited.
              echo "Looking up '${PIPELINE_NAME}' in '${PROJECT}'..."
              PIPELINES=$(curl -fsS -u ":${ENT_DISPATCH_PAT}" \
                "${ORG_URL}${PROJECT}/_apis/pipelines?api-version=7.0")
              PIPELINE_ID=$(echo "$PIPELINES" | jq -r --arg n "$PIPELINE_NAME" \
                '.value[] | select(.name == $n) | .id' | head -1)

              if [ -z "$PIPELINE_ID" ] || [ "$PIPELINE_ID" = "null" ]; then
                echo "ERROR: pipeline '${PIPELINE_NAME}' not found in project '${PROJECT}'." >&2
                echo "Register ci/build-and-test-e2e-c-client.yaml in" >&2
                echo "the Azure DevOps UI under that name to enable the" >&2
                echo "cross-repo c_client e2e check." >&2
                exit 1
              fi

              CLIENT_PR_NUMBER="$(System.PullRequest.PullRequestNumber)"
              if [ -z "${CLIENT_PR_NUMBER}" ] || [ "${CLIENT_PR_NUMBER}" = "None" ]; then
                # Branch builds (e.g. nightly on main) still benefit
                # from the cross-repo check, but there's no PR number
                # to attach a status to. The Enterprise pipeline's
                # report stage skips the GitHub-status POST when
                # cClientPrNumber is empty.
                CLIENT_PR_NUMBER=""
              fi

              # Forward the client branch name as a hint for the
              # Enterprise side to try a same-name branch match
              # (xyz → xyz, fallback to main). For a PR build,
              # System.PullRequest.SourceBranch is `refs/heads/xyz`;
              # for a direct branch build the branch name is in
              # Build.SourceBranchName already. Strip refs/heads/ so
              # the Enterprise step can use it directly as a git ref.
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                CLIENT_BRANCH="$(System.PullRequest.SourceBranch)"
                CLIENT_BRANCH="${CLIENT_BRANCH#refs/heads/}"
              else
                CLIENT_BRANCH="$(Build.SourceBranchName)"
              fi
              echo "Client branch hint: ${CLIENT_BRANCH}"

              # `templateParameters` matches the `parameters:` block
              # in build-and-test-e2e-c-client.yaml.
              BODY=$(jq -n \
                --arg commit "$(Build.SourceVersion)" \
                --arg pr "${CLIENT_PR_NUMBER}" \
                --arg branch "${CLIENT_BRANCH}" \
                '{
                  templateParameters: {
                    cClientCommit: $commit,
                    cClientPrNumber: $pr,
                    clientBranch: $branch
                  },
                  resources: { repositories: { self: { refName: "refs/heads/main" } } }
                }')

              echo "POSTing pipeline run with body:"
              echo "$BODY" | jq .

              RESPONSE=$(curl -fsS -u ":${ENT_DISPATCH_PAT}" \
                -H "Content-Type: application/json" \
                -X POST \
                -d "$BODY" \
                "${ORG_URL}${PROJECT}/_apis/pipelines/${PIPELINE_ID}/runs?api-version=7.0")

              RUN_URL=$(echo "$RESPONSE" | jq -r '._links.web.href // ""')
              echo "Enterprise build queued: ${RUN_URL}"
            displayName: "Queue enterprise c_client e2e"
            env:
              # The PAT is a secret pipeline variable that must be set
              # on this pipeline in the ADO UI (Variables → +, name
              # ENT_DISPATCH_PAT, mark as secret). Secret variables
              # aren't auto-exposed to script env; the explicit
              # `env:` mapping below is required.
              ENT_DISPATCH_PAT: $(ENT_DISPATCH_PAT)
